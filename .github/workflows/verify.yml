name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install independent Linux media verifier
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Select independent Linux decoder
        if: runner.os == 'Linux'
        run: echo "MEDIA_VERIFY_FFMPEG=/usr/bin/ffmpeg" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app tests tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/web/media-profiles.js
      - run: node --check app/web/community.js
      - run: node tests/media_profiles_ui.cjs
