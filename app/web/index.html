<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mosaic · 每一帧，都值得分享</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/video.css"></head><body>
<header class="video-header"><a class="brand" href="/"><span class="brand-mark">M</span>Mosaic<span class="small muted brand-sub">视频与灵感</span></a><form id="search-form"><input id="search" placeholder="搜索你的视频"><button class="search-btn" aria-label="搜索">⌕</button></form><button id="upload-open" class="btn">＋ 投稿</button></header>
<main class="video-main"><section id="browse"><div class="community-hero"><div><div class="eyebrow">CREATE / SHARE / CONNECT</div><h1>每一帧，都值得分享。</h1><p>把你的创作放在这里。从一个视频，开始新的故事。</p><span class="badge">本地创作者社区 · v0.2.1</span></div><div class="hero-art" aria-hidden="true"><div class="film tile-a">▶</div><div class="film tile-b">✦</div><div class="film tile-c">◉</div></div></div>
<div class="toolbar"><div class="row" id="categories"></div><button class="btn secondary" id="favorites">☆ 我的收藏</button></div><div class="row"><h2 id="feed-title">最新投稿</h2><span class="spacer"></span><span class="small muted" id="feed-count"></span></div><div id="feed" class="video-grid"></div></section>
<section id="watch" class="hidden"><button id="back" class="btn secondary">← 返回社区</button><div class="watch-layout"><div><h1 id="watch-title"></h1><div class="player-wrap"><video id="player" controls playsinline preload="metadata"></video><div id="danmaku-layer" aria-hidden="true"></div></div><form id="danmaku-form" class="danmaku-bar"><label class="small"><input type="checkbox" id="show-danmaku" checked> 弹幕</label><input id="danmaku-text" placeholder="发一条友善的弹幕" maxlength="80"><button class="btn">发送</button></form><div class="row" style="margin:20px 0"><button class="btn secondary" id="like">♡ 点赞</button><button class="btn secondary" id="favorite">☆ 收藏</button><span id="video-category" class="badge"></span></div><p id="description" class="muted answer"></p><section class="panel" style="margin-top:25px"><h2>评论区</h2><form id="comment-form" class="row"><input id="comment-text" class="grow" placeholder="分享你的看法" maxlength="1000" required><button class="btn" id="comment-submit">发布</button></form><div id="comments"></div></section></div><aside class="panel creator"><div class="avatar">M</div><h3>本地创作者</h3><p class="muted small">你的创作与收藏都保存在本机。注册账户后可保存独立收藏并管理自己的作品。</p><div id="media-info" class="small muted"></div></aside></div></section>
<footer>Mosaic · 记录生活，分享灵感。支持 MP4 / WebM · 后台封面与 HLS 自适应播放。</footer></main>
<dialog id="upload-dialog"><h2>发布你的作品</h2><p class="muted small">MP4 / WebM，最高512MiB。实际播放取决于浏览器编码支持。</p><form id="upload-form"><label>作品标题<input id="title" maxlength="100" required></label><label>分区<select id="category"></select></label><label>简介<textarea id="description-input" rows="3" maxlength="2000"></textarea></label><label class="upload-zone">选择视频文件<input type="file" id="video-file" accept=".mp4,.webm" required></label><progress id="upload-progress" value="0" max="100" class="hidden"></progress><p id="upload-status" class="small muted"></p><div class="row"><button class="btn secondary" type="button" id="upload-close">取消</button><button class="btn" id="upload-submit">发布视频</button></div></form></dialog><div id="toast" class="toast" role="status"></div><script src="/common.js"></script><script src="/app.js"></script><script src="/accounts.js"></script><script src="/vendor/hls.light.min.js"></script><script src="/media-profiles.js"></script><script src="/community.js"></script></body></html>
